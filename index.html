<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Co je to AI</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  margin: 0;
  padding: 20px;
}

h1 { text-align: center; }
h2 { text-align: center; color:#555; }

/* GRID */
.grid {
  display: grid;
  gap: 20px;
}

.top-grid {
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
}

.middle-row, .bottom-grid {
  grid-template-columns: repeat(3, 1fr);
}

/* KARTA */
.case {
  background: #fff;
  border-radius: 10px;
  padding: 10px;
}

.main-img img {
  width: 100%;
  border-radius: 8px;
  cursor: pointer;
}

/* FULLSCREEN */
#viewer {
  display:none;
  position:fixed;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
}

#viewer img {
  max-width:90%;
}

#closeBtn {
  position:absolute;
  top:20px;
  right:20px;
  color:white;
  font-size:30px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>Co je to AI</h1>
<h2>Plakátky žáků</h2>

<div id="board"></div>

<div id="viewer">
  <div id="closeBtn" onclick="closeViewer()">✖</div>
  <img id="viewerImg">
</div>

<script>

/* ✅ OBRÁZKY NATVRDO */
let cases = [
 {main:"https://raw.githubusercontent.com/zspastelka/Co-je-AI/main/img/AI%204.A_1.jpg"},
 {main:"https://raw.githubusercontent.com/zspastelka/Co-je-AI/main/img/AI%204.A_2.jpg"},
 {main:"https://raw.githubusercontent.com/zspastelka/Co-je-AI/main/img/AI%204.A_3.jpg"},
 {main:"https://raw.githubusercontent.com/zspastelka/Co-je-AI/main/img/AI%204.A_4.jpg"},
 {main:"https://raw.githubusercontent.com/zspastelka/Co-je-AI/main/img/AI%204.A_5.jpg"},
 {main:"https://raw.githubusercontent.com/zspastelka/Co-je-AI/main/img/AI%204.A_6.jpg"},
 {main:"https://raw.githubusercontent.com/zspastelka/Co-je-AI/main/img/AI%204.A_7.jpg"},
 {main:"https://raw.githubusercontent.com/zspastelka/Co-je-AI/main/img/AI%204.A_8.jpg"},
 {main:"https://raw.githubusercontent.com/zspastelka/Co-je-AI/main/img/AI%204.A_9.jpg"},
 {main:"https://raw.githubusercontent.com/zspastelka/Co-je-AI/main/img/AI%204.A_10.jpg"}
];

/* FULLSCREEN */
function openViewer(src){
  document.getElementById("viewerImg").src = src;
  document.getElementById("viewer").style.display = "flex";
}

function closeViewer(){
  document.getElementById("viewer").style.display = "none";
}

/* RENDER */
function render(){

  const board=document.getElementById("board");
  board.innerHTML="";

  const top=document.createElement("div");
  top.className="grid top-grid";

  const middle=document.createElement("div");
  middle.className="grid middle-row";

  const bottom=document.createElement("div");
  bottom.className="grid bottom-grid";

  cases.forEach((c,i)=>{

    const box=document.createElement("div");
    box.className="case";

    box.innerHTML=`<h3>Plakát ${i+1}</h3>`;

    if(c.main){
      const img=document.createElement("img");
      img.src=c.main;
      img.onclick=()=>openViewer(c.main);
      box.appendChild(img);
    }

    if(i<4) top.appendChild(box);
    else if(i<=6) middle.appendChild(box);
    else bottom.appendChild(box);

  });

  board.appendChild(top);
  board.appendChild(middle);
  board.appendChild(bottom);
}

render();

</script>

</body>
</html>
