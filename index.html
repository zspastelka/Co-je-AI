<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Co je to AI</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  margin: 0;
  padding: 20px;
}

/* LOGA */
#logo-left {
  position: fixed;
  top: 15px;
  left: 15px;
  text-align: center;
}
#logo-left img { height: 60px; }

#logo-right {
  position: fixed;
  top: 15px;
  right: 15px;
}
#logo-right img { height: 60px; }

.support-text { font-size:11px; }

/* NADPISY */
h1 { text-align: center; margin-bottom: 5px; }
h2 { text-align: center; font-size: 18px; color: #555; margin-top: 0; }




#method {
 background: #fff;
  border-left: 6px solid #4a90e2;
  padding: 20px;
  margin-bottom: 20px;
  font-size: 16px;
line-height: 1.5; 
}




/* OVLÁDÁNÍ */
#mode-bar {
  text-align: center;
  margin-bottom: 20px;
}
#mode-bar button {
  padding: 3px 8px;
  font-size: 12px;
  margin: 0 5px;
  cursor: pointer;
}

/* GRID */
.grid {
  display: grid;
  gap: 20px;
}

.top-grid {
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
}

.middle-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr); /* ✅ vyplní celý řádek */
  gap: 20px;
  margin: 20px 0;
}

.bottom-grid {
  grid-template-columns: repeat(3, 1fr); /* ✅ taky celý řádek */
}

/* KARTA */
.case {
  background: #fff;
  border-radius: 12px;
  padding: 10px;
  width: 100%; /* ✅ důležité */
}

.case h3 {
  text-align: center;
  margin: 6px 0;
}

.main-img {
  border: 4px solid #ccc;
  border-radius: 8px;
}

.main-img img {
  width: 100%;
  border-radius: 6px;
  cursor: pointer;
}

/* TLAČÍTKA */
button {
  padding: 4px 8px;
  margin: 4px;
  font-size: 12px;
  cursor: pointer;
  width: auto;
}

.main-img button {
  width: 100%;
}

/* FULLSCREEN */
#viewer {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  justify-content: center;
  align-items: center;
  z-index: 2000;
}

#viewer img {
  max-width: 90%;
  max-height: 90%;
}

#closeBtn {
  position: absolute;
  top: 20px;
  right: 20px;
  font-size: 30px;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- LOGA -->
<div id="logo-left">
   <img src="logo-o2-chytra-skola.png">
  <div class="support-text">Podpořeno z programu O2 Chytrá škola.</div>
</div>

<div id="logo-right">
   <img src="logo-zs-pastelka.png">
</div>

<h1>Co je to AI</h1>
<h2>Vyhledáváme informace o AI a tvoříme plakátky</h2>

<div id="method">
<b>Jak jsme pracovali:</b><br>
Žáci měli za úkol vyhledat informace o AI a vytvořit plakátky.
</div>


<div id="mode-bar">
  <button onclick="teacherMode()">Učitelský režim</button>
  <button onclick="studentMode()">Žákovský režim</button>
</div>

<div id="board"></div>

<!-- FULLSCREEN -->
<div id="viewer">
  <div id="closeBtn" onclick="closeViewer()">✖</div>
  <img id="viewerImg">
</div>

<script>

const PASSWORD = "ucitelka";
let isTeacher = false;

let cases = JSON.parse(localStorage.getItem("ai_cases")) ||
  Array.from({length:10}, () => ({
    color: "#cccccc",
    main: ""
  }));

cases = cases.slice(0,10);

/* REŽIM */
function teacherMode(){
  if(prompt("Zadej heslo:")!==PASSWORD) return;
  isTeacher=true;
  render();
}

function studentMode(){
  isTeacher=false;
  render();
}

/* ULOŽENÍ */
function save(){
  localStorage.setItem("ai_cases", JSON.stringify(cases));
}

/* VÝBĚR */
function pickImage(i){

  const input=document.createElement("input");
  input.type="file";

  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;

    cases[i].main = "img/" + file.name;

    save();
    render();
  };

  input.click();
}

/* FULLSCREEN */
function openViewer(src){
  document.getElementById("viewerImg").src = src;
  document.getElementById("viewer").style.display = "flex";
}

function closeViewer(){
  document.getElementById("viewer").style.display = "none";
}

/* RENDER */
function render(){

  const board=document.getElementById("board");
  board.innerHTML="";

  const top=document.createElement("div");
  top.className="grid top-grid";

  const middle=document.createElement("div");
  middle.className="middle-row";

  const bottom=document.createElement("div");
  bottom.className="grid bottom-grid";

  cases.forEach((c,i)=>{

    const box=document.createElement("div");
    box.className="case";

    box.innerHTML=`<h3>Plakát ${i+1}</h3>`;

    const main=document.createElement("div");
    main.className="main-img";
    main.style.borderColor=c.color;

    if(c.main){
      const img=document.createElement("img");
      img.src=c.main;
      img.onclick=()=>openViewer(c.main); // ✅ zvětšení
      main.appendChild(img);
    }

    if(isTeacher){

      const btn=document.createElement("button");
      btn.textContent="Vybrat obrázek";
      btn.onclick=()=>pickImage(i);
      main.appendChild(btn);

      const del=document.createElement("button");
      del.textContent="✖ Odstranit obrázek";
      del.style.background="#e74c3c";
      del.style.color="white";
      del.onclick=()=>{
        c.main="";
        save();
        render();
      };
      main.appendChild(del);

      const color=document.createElement("input");
      color.type="color";
      color.value=c.color;
      color.oninput=e=>{
        c.color=e.target.value;
        save();
        render();
      };
      main.appendChild(color);
    }

    box.appendChild(main);

    if(i < 4){
      top.appendChild(box);
    } else if(i <= 6){
      middle.appendChild(box);
    } else {
      bottom.appendChild(box);
    }

  });

  board.appendChild(top);
  board.appendChild(middle);
  board.appendChild(bottom);
}

render();

</script>

</body>
</html>
