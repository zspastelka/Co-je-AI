<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Plakátky AI</title>

<style>
body {
  font-family: Arial;
  background: #f4f6f8;
  padding: 20px;
}

/* ✅ RESPONZIVNÍ GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
}

/* KARTA */
.case {
  background: white;
  padding: 10px;
  border-radius: 10px;
  text-align: center;
}

.case img {
  width: 100%;
  border-radius: 8px;
  cursor: pointer;
}

/* FULLSCREEN */
#viewer {
  display:none;
  position:fixed;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
}

#viewer img {
  max-width:90%;
}

#close {
  position:absolute;
  top:20px;
  right:30px;
  color:white;
  font-size:30px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>Plakátky o AI</h1>

<div id="board" class="grid"></div>

<div id="viewer">
  <div id="close" onclick="closeViewer()">✖</div>
  <img id="bigImg">
</div>

<script>

const images = [
"https://raw.githubusercontent.com/zspastelka/Co-je-AI/main/img/AI%204.A_1.jpg",
"https://raw.githubusercontent.com/zspastelka/Co-je-AI/main/img/AI%204.A_2.jpg",
"https://raw.githubusercontent.com/zspastelka/Co-je-AI/main/img/AI%204.A_3.jpg",
"https://raw.githubusercontent.com/zspastelka/Co-je-AI/main/img/AI%204.A_4.jpg",
"https://raw.githubusercontent.com/zspastelka/Co-je-AI/main/img/AI%204.A_5.jpg",
"https://raw.githubusercontent.com/zspastelka/Co-je-AI/main/img/AI%204.A_6.jpg",
"https://raw.githubusercontent.com/zspastelka/Co-je-AI/main/img/AI%204.A_7.jpg",
"https://raw.githubusercontent.com/zspastelka/Co-je-AI/main/img/AI%204.A_8.jpg",
"https://raw.githubusercontent.com/zspastelka/Co-je-AI/main/img/AI%204.A_9.jpg",
"https://raw.githubusercontent.com/zspastelka/Co-je-AI/main/img/AI%204.A_10.jpg"
];

const board = document.getElementById("board");

images.forEach((src, i) => {
  const box = document.createElement("div");
  box.className = "case";

  const title = document.createElement("h3");
  title.textContent = "Plakát " + (i+1);

  const img = document.createElement("img");
  img.src = src;
  img.onclick = () => openViewer(src);

  box.appendChild(title);
  box.appendChild(img);
  board.appendChild(box);
});

function openViewer(src){
  document.getElementById("bigImg").src = src;
  document.getElementById("viewer").style.display = "flex";
}

function closeViewer(){
  document.getElementById("viewer").style.display = "none";
}

</script>

</body>
</html>
